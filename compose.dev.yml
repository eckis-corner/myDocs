# Lokal bauen statt das Image aus ghcr.io zu ziehen:
#   docker compose -f docker-compose.yml -f compose.dev.yml up -d --build
# Nur die Datenbank für die Entwicklung (dotnet run / F5 in VS Code):
#   docker compose -f docker-compose.yml -f compose.dev.yml up -d db
services:
  app:
    image: mydocs:dev
    build:
      context: .
      args:
        VERSION: 0.1.0-dev
      secrets:
        - nuget_auth

  db:
    environment:
      POSTGRES_PASSWORD: mydocs
    # Nur auf localhost und auf 5433, damit die Datenbank von myLife (5432) daneben laufen kann.
    ports:
      - "127.0.0.1:5433:5432"

secrets:
  nuget_auth:
    environment: NuGetPackageSourceCredentials_eckiscorner

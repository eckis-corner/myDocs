# myDocs – Docker Compose für die Synology (Container Manager → Projekt).
# TLS übernimmt der vorhandene Nginx Proxy Manager; die App lauscht nur auf MYDOCS_PORT.
# Der Worker (OCR, Office-Vorschau, Vorschaubilder) hängt nur im internen Netz „worker“ ohne Internet.
name: mydocs

services:
  app:
    image: ghcr.io/eckis-corner/mydocs:${MYDOCS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__MyDocs: "Host=db;Port=5432;Database=mydocs;Username=mydocs;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env};Gss Encryption Mode=Disable"
      MyDocs__DataDirectory: /data
      # Sicherungsschlüssel (32 Byte Base64); ohne ihn keine automatische Sicherung
      MyDocs__BackupKey: ${MYDOCS_BACKUP_KEY:-}
      MyDocs__WorkerUrl: http://worker:8080
      # Scan-Ordner (M3.5): Freigabe, in die der Scanner schreibt; leer lassen, wenn es keinen gibt.
      MyDocs__ScanDirectory: /scan
      TZ: ${TZ:-Europe/Berlin}
    networks:
      - default
      - worker
    ports:
      - "${MYDOCS_PORT:-8090}:8080"
    volumes:
      - ${MYDOCS_DATA_DIR:-./data}/app:/data
      - ${MYDOCS_SCAN_DIR:-./data/scan}:/scan
    mem_limit: 512m

  # Zustandslos: kein Volume, keine Schlüssel, keine Datenbank. Dateien liegen nur während der Arbeit im tmpfs.
  worker:
    image: ghcr.io/eckis-corner/mydocs-worker:${MYDOCS_VERSION:-latest}
    restart: unless-stopped
    networks:
      - worker
    read_only: true
    tmpfs:
      - /tmp:size=768m
    environment:
      TZ: ${TZ:-Europe/Berlin}
    mem_limit: 1536m

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydocs
      POSTGRES_USER: mydocs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${MYDOCS_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydocs -d mydocs"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

networks:
  # Intern: Der Worker erreicht nur die App, nicht das Internet (Office-Dateien laden keine fremden Inhalte nach).
  worker:
    internal: true

# myDocs – Docker Compose für die Synology (Container Manager → Projekt).
# TLS übernimmt der vorhandene Nginx Proxy Manager; die App lauscht nur auf MYDOCS_PORT.
# Der Worker für OCR und Vorschau (mydocs-worker) kommt mit M3 dazu.
name: mydocs

services:
  app:
    image: ghcr.io/eckis-corner/mydocs:${MYDOCS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__MyDocs: "Host=db;Port=5432;Database=mydocs;Username=mydocs;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env};Gss Encryption Mode=Disable"
      MyDocs__DataDirectory: /data
      # Sicherungsschlüssel (32 Byte Base64); ohne ihn keine automatische Sicherung
      MyDocs__BackupKey: ${MYDOCS_BACKUP_KEY:-}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "${MYDOCS_PORT:-8090}:8080"
    volumes:
      - ${MYDOCS_DATA_DIR:-./data}/app:/data
    mem_limit: 512m

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydocs
      POSTGRES_USER: mydocs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${MYDOCS_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydocs -d mydocs"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
